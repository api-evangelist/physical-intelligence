aid: physical-intelligence
name: Physical Intelligence
description: >-
  Physical Intelligence (often styled "Pi" or "π") is a San Francisco-based
  research company building general-purpose foundation models for robotics
  with the stated goal of producing learning algorithms that can control any
  robot to do any task. The company has published a continuing line of
  Vision-Language-Action (VLA) models: π0 (October 2024, first generalist
  multi-task multi-robot policy), π0-FAST (autoregressive variant via Real-time
  Action Chunking / FAST tokenization), π0.5 (April 2025, open-world
  generalization), π*0.6 (November 2025, reinforcement-learning from
  experience), and π0.7 (April 2026, steerable model with emergent
  capabilities). Physical Intelligence releases significant work as open
  source: the openpi repository (~12K stars) is the canonical home for π0
  weights and code, with companion repos including real-time-chunking-kinetix,
  pi-data-sharing, aloha, augmax, and rlds_dataset_builder. The company does
  not yet offer a hosted commercial API; access to the platform is via
  open-weight models and research collaborations.
